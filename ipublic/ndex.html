<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LocomotePro Voice</title>
<style>
  :root{
    --navy0:#031024; --navy1:#05091A; --navy2:#0B1330; --panel:#111B3D;
    --line:rgba(143,160,188,0.16); --cyan:#2DD4E0; --green:#2BD17E; --amber:#F6A93B;
    --text:#EEF3FB; --muted:#8FA0BC;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--navy1);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;justify-content:center;padding:24px 12px;min-height:100vh}
  .card{width:100%;max-width:440px;height:680px;background:var(--navy2);border:1px solid var(--line);
    border-radius:20px;box-shadow:0 20px 55px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden}
  .head{background:var(--navy0);padding:15px 18px 13px}
  .row{display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--cyan),var(--green));
    display:flex;align-items:center;justify-content:center;font-size:20px}
  .title{font-weight:600;font-size:15px;color:var(--text)}
  .sub{font-size:11px;color:var(--muted)}
  .langs{display:flex;gap:4px}
  .langs button{font-size:11.5px;padding:3px 8px;border-radius:7px;border:none;cursor:pointer;
    background:rgba(255,255,255,.06);color:var(--muted)}
  .langs button.on{background:var(--cyan);color:var(--navy0);font-weight:600}
  .body{flex:1;display:flex;flex-direction:column;min-height:0}
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 26px}
  .scroll{flex:1;overflow-y:auto;padding:16px 16px 8px}
  .msg{display:flex;margin-bottom:9px}
  .msg .b{max-width:88%;padding:8px 12px;border-radius:12px;font-size:13.5px;line-height:1.5;
    display:flex;gap:7px;align-items:flex-start}
  .msg.u{justify-content:flex-end}
  .msg.u .b{background:rgba(45,212,224,.12);color:var(--text);border:1px solid rgba(45,212,224,.3)}
  .msg.a .b{background:var(--panel);color:var(--text);border:1px solid var(--line)}
  .msg.g .b{background:var(--panel);color:var(--text);border:1px solid rgba(43,209,126,.35)}
  .who{display:block;font-size:10.5px;color:var(--green);font-weight:600;margin-bottom:2px}
  .dot{width:14px;height:14px;flex:none;margin-top:2px}
  .banner{border-radius:10px;padding:8px 11px;margin-bottom:12px;font-size:12px}
  .banner.warn{background:rgba(246,169,59,.10);border:1px solid rgba(246,169,59,.28);color:var(--amber)}
  .banner.live{background:rgba(43,209,126,.10);border:1px solid rgba(43,209,126,.28);color:var(--green);
    display:flex;align-items:center;justify-content:space-between}
  .banner.live button{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--line);
    border-radius:8px;padding:3px 10px;font-size:11.5px;cursor:pointer}
  .status{font-size:13px;margin:12px 0;font-weight:500;color:var(--muted)}
  .status.listening{color:var(--cyan)} .status.speaking{color:var(--green)}
  .controls{display:flex;align-items:center;gap:14px}
  .mini{width:42px;height:42px;border-radius:21px;border:1px solid var(--line);background:rgba(255,255,255,.04);
    cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px;text-decoration:none}
  .mic{width:58px;height:58px;border-radius:29px;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--cyan),var(--green));display:flex;align-items:center;justify-content:center;font-size:24px}
  .mic.on{background:var(--cyan);box-shadow:0 0 0 6px rgba(45,212,224,.15);animation:bob 1.1s ease-in-out infinite}
  .mic.sp{background:var(--green)}
  .foot{border-top:1px solid var(--line);background:var(--navy0);padding:14px 18px 16px;display:flex;flex-direction:column;align-items:center}
  .voicebar{margin-bottom:12px;max-width:260px;background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:9px;padding:5px 9px;font-size:11.5px}
  .btn{border:none;border-radius:14px;padding:13px 30px;font-size:15px;font-weight:600;cursor:pointer;
    background:linear-gradient(135deg,var(--cyan),var(--green));color:var(--navy0)}
  .esc{margin:0 14px 10px;border:1px solid rgba(43,209,126,.35);border-radius:14px;overflow:hidden;background:var(--panel)}
  .esc .top{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;background:linear-gradient(90deg,var(--navy0),#0C2A1B)}
  .esc .tag{font-size:9.5px;color:var(--green);text-transform:uppercase;letter-spacing:.5px;border:1px solid rgba(43,209,126,.4);border-radius:6px;padding:2px 6px}
  .esc .pad{padding:11px 13px}
  .esc .full{width:100%;background:var(--cyan);color:var(--navy0);border:none;border-radius:10px;padding:10px;font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:10px}
  .esc .num{display:flex;align-items:center;justify-content:space-between;background:var(--navy2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:9px;text-decoration:none}
  .esc .num b{font-size:15.5px;color:var(--text)} .esc .num span{font-size:10.5px;color:var(--muted)}
  .esc .two{display:flex;gap:8px}
  .esc .call{flex:1;text-align:center;background:var(--green);color:var(--navy0);border-radius:10px;padding:9px;font-size:13px;font-weight:600;text-decoration:none}
  .esc .keep{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:12.5px;cursor:pointer}
  .orb{position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center}
  .orb .core{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--cyan),var(--navy2));
    box-shadow:0 0 26px rgba(45,212,224,.4),inset 0 0 18px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:26px}
  .orb.speaking .core{background:radial-gradient(circle at 35% 30%,var(--green),var(--navy2));box-shadow:0 0 26px rgba(43,209,126,.45);animation:bob .9s ease-in-out infinite}
  .orb.thinking .core{animation:spin 1.6s linear infinite}
  .orb .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--cyan);animation:ring 1.8s ease-out infinite}
  .orb.speaking .ring{border-color:var(--green)}
  .orb .ring.b{animation-delay:.6s}.orb .ring.c{animation-delay:1.2s}
  .hidden{display:none!important}
  .type{display:flex;align-items:center;gap:8px;margin-top:14px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 6px 5px 12px}
  .type input{flex:1;border:none;outline:none;background:transparent;font-size:14px;color:var(--text)}
  .type button{width:34px;height:34px;border-radius:9px;border:none;background:var(--cyan);color:var(--navy0);cursor:pointer;font-size:15px}
  [dir=rtl] .msg.u{justify-content:flex-start}
  [dir=rtl] .msg.a,[dir=rtl] .msg.g{justify-content:flex-end}
  @keyframes ring{0%{transform:scale(.75);opacity:.55}100%{transform:scale(1.7);opacity:0}}
  @keyframes bob{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="row">
      <div class="brand">
        <div class="logo">🚚</div>
        <div><div class="title">LocomotePro</div><div class="sub">Voice assistant · Wahyd LOS</div></div>
      </div>
      <div class="langs" id="langs"></div>
    </div>
  </div>
  <div class="body" id="body"></div>
</div>

<script>
const HELPLINE = "+880 1891-446666";
const SPECIALIST = "Tanvir Ahmed";
const CODE = { en:"en-US", ur:"ur-PK", ar:"ar-SA", bn:"bn-BD" };
const RTL = { en:false, ur:true, ar:true, bn:false };
const LANGS = [ {id:"en",label:"EN"},{id:"ur",label:"اردو"},{id:"ar",label:"عربي"},{id:"bn",label:"বাংলা"} ];

const T = {
  en:{ startTitle:"Talk to LocomotePro", startSub:"Ask about tracking, pricing, trips or the GPS mandate. Just speak.",
    start:"Start", tap:"Tap to speak", listening:"Listening…", thinking:"Thinking…", speaking:"Speaking…",
    greeting:"Hi, I'm the LocomotePro voice assistant. How can I help you today?",
    typePh:"Type your question…", micBlocked:"I couldn't reach the microphone. Allow mic access, or type below and I'll still reply out loud.",
    error:"Sorry, I didn't catch that. Could you try again?",
    callTitle:"Call our helpline", finalStep:"Final step", callHours:"Mon to Sat · 9am to 9pm", callNow:"Call now",
    talkSpecialist:"Talk to a specialist", specialist:"Specialist", liveWith:"Live with a specialist", end:"End", keep:"Keep talking",
    agentGreeting:"Hi, this is "+SPECIALIST+", a support specialist. I've got your chat, so tell me what you need and I'll sort it out.",
    back:"You're back with the assistant." },
  ur:{ startTitle:"LocomotePro سے بات کریں", startSub:"ٹریکنگ، قیمت، ٹرپ یا GPS مینڈیٹ کے بارے میں بولیں۔",
    start:"شروع کریں", tap:"بولنے کے لیے دبائیں", listening:"سن رہا ہوں…", thinking:"سوچ رہا ہوں…", speaking:"بول رہا ہوں…",
    greeting:"خوش آمدید، میں LocomotePro وائس اسسٹنٹ ہوں۔ میں آپ کی کیا مدد کر سکتا ہوں؟",
    typePh:"اپنا سوال لکھیں…", micBlocked:"مائیک تک رسائی نہ ہو سکی۔ اجازت دیں یا نیچے لکھیں، میں پھر بھی بول کر جواب دوں گا۔",
    error:"معذرت، سمجھ نہیں سکا۔ دوبارہ کوشش کریں؟",
    callTitle:"ہماری ہیلپ لائن پر کال کریں", finalStep:"آخری مرحلہ", callHours:"پیر تا ہفتہ · 9 تا 9", callNow:"ابھی کال کریں",
    talkSpecialist:"ماہر سے بات کریں", specialist:"ماہر", liveWith:"ماہر کے ساتھ لائیو", end:"ختم", keep:"بات جاری رکھیں",
    agentGreeting:"السلام علیکم، میں "+SPECIALIST+" ہوں، سپورٹ اسپیشلسٹ۔ بتائیں کیا درکار ہے، میں حل کرتا ہوں۔",
    back:"آپ دوبارہ اسسٹنٹ کے ساتھ ہیں۔" },
  ar:{ startTitle:"تحدّث إلى LocomotePro", startSub:"اسأل عن التتبّع أو الأسعار أو الرحلات أو تفويض GPS. تكلّم فقط.",
    start:"ابدأ", tap:"اضغط للتحدّث", listening:"أستمع…", thinking:"أفكّر…", speaking:"أتحدّث…",
    greeting:"مرحبًا، أنا مساعد LocomotePro الصوتي. كيف يمكنني مساعدتك اليوم؟",
    typePh:"اكتب سؤالك…", micBlocked:"تعذّر الوصول إلى الميكروفون. اسمح بالوصول أو اكتب أدناه وسأرد بصوت مسموع.",
    error:"عذرًا، لم أفهم. حاول مرة أخرى؟",
    callTitle:"اتصل بخط الدعم لدينا", finalStep:"الخطوة الأخيرة", callHours:"الاثنين إلى السبت · 9 إلى 9", callNow:"اتصل الآن",
    talkSpecialist:"تحدّث إلى مختص", specialist:"مختص", liveWith:"مباشر مع مختص", end:"إنهاء", keep:"تابع الحديث",
    agentGreeting:"مرحبًا، أنا "+SPECIALIST+"، أخصائي دعم. أخبرني بما تحتاجه وسأتولّاه.",
    back:"لقد عدت إلى المساعد." },
  bn:{ startTitle:"LocomotePro-এর সাথে কথা বলুন", startSub:"ট্র্যাকিং, দাম, ট্রিপ বা GPS ম্যান্ডেট নিয়ে বলুন। শুধু বলুন।",
    start:"শুরু করুন", tap:"বলতে ট্যাপ করুন", listening:"শুনছি…", thinking:"ভাবছি…", speaking:"বলছি…",
    greeting:"হ্যালো, আমি LocomotePro ভয়েস অ্যাসিস্ট্যান্ট। আজ কীভাবে সাহায্য করতে পারি?",
    typePh:"আপনার প্রশ্ন লিখুন…", micBlocked:"মাইক্রোফোন অ্যাক্সেস করা গেল না। অনুমতি দিন বা নিচে লিখুন, আমি তবুও শব্দ করে উত্তর দেব।",
    error:"দুঃখিত, বুঝতে পারিনি। আবার বলবেন?",
    callTitle:"আমাদের হেল্পলাইনে কল করুন", finalStep:"চূড়ান্ত ধাপ", callHours:"সোম-শনি · ৯টা-৯টা", callNow:"এখনই কল করুন",
    talkSpecialist:"বিশেষজ্ঞের সাথে কথা বলুন", specialist:"বিশেষজ্ঞ", liveWith:"বিশেষজ্ঞের সাথে লাইভ", end:"শেষ", keep:"চালিয়ে যান",
    agentGreeting:"হ্যালো, আমি "+SPECIALIST+", একজন সাপোর্ট বিশেষজ্ঞ। বলুন কী দরকার, আমি সমাধান করে দিচ্ছি।",
    back:"আপনি আবার অ্যাসিস্ট্যান্টের সাথে আছেন।" },
};

let lang = "en";
let started = false;
let mode = "ai";              // ai | agent
let uiMode = "idle";          // idle | listening | thinking | speaking
let messages = [];            // {role:'user'|'assistant'|'agent', text}
let escalated = null;
let currentAudio = null;
const tel = "tel:" + HELPLINE.replace(/\s/g,"");

const body = document.getElementById("body");

function renderLangs(){
  const el = document.getElementById("langs");
  el.innerHTML = "";
  LANGS.forEach(l=>{
    const b=document.createElement("button");
    b.textContent=l.label; if(l.id===lang) b.className="on";
    b.onclick=()=>{ lang=l.id; renderLangs(); render(); };
    el.appendChild(b);
  });
}

function render(){
  const t=T[lang];
  if(!started){
    body.innerHTML =
      '<div class="center" dir="'+(RTL[lang]?"rtl":"ltr")+'">'+
        orb("idle")+
        '<div style="font-size:20px;font-weight:600;color:var(--text);margin:26px 0 8px">'+t.startTitle+'</div>'+
        '<div style="font-size:13.5px;color:var(--muted);line-height:1.55;margin-bottom:26px;max-width:300px">'+t.startSub+'</div>'+
        '<button class="btn" id="startBtn">🎙 '+t.start+'</button>'+
      '</div>';
    document.getElementById("startBtn").onclick=start;
    return;
  }
  const dir = RTL[lang]?"rtl":"ltr";
  body.innerHTML =
    '<div class="scroll" id="scroll" dir="'+dir+'"></div>'+
    (escalated ? escBlock() : "")+
    '<div class="foot">'+
      '<div class="orb-wrap" id="orbTap">'+orb(uiMode)+'</div>'+
      '<div class="status '+uiMode+'" id="status">'+statusText()+'</div>'+
      '<div class="controls">'+
        '<div class="mini" id="kbBtn">⌨️</div>'+
        '<button class="mic '+(uiMode==="listening"?"on":uiMode==="speaking"?"sp":"")+'" id="micBtn">🎙</button>'+
        '<a class="mini" href="'+tel+'">📞</a>'+
      '</div>'+
      '<div class="type hidden" id="typeRow" dir="'+dir+'">'+
        '<input id="typeInput" placeholder="'+t.typePh+'" />'+
        '<button id="typeSend">➤</button>'+
      '</div>'+
    '</div>';
  document.getElementById("micBtn").onclick=onMic;
  document.getElementById("orbTap").onclick=onMic;
  document.getElementById("kbBtn").onclick=()=>document.getElementById("typeRow").classList.toggle("hidden");
  document.getElementById("typeSend").onclick=sendTyped;
  document.getElementById("typeInput").addEventListener("keydown",e=>{ if(e.key==="Enter") sendTyped(); });
  if(escalated){
    const s=document.getElementById("specBtn"); if(s) s.onclick=startSpecialist;
    const k=document.getElementById("keepBtn"); if(k) k.onclick=()=>{ escalated=null; render(); };
  }
  const endB=document.getElementById("endBtn"); if(endB) endB.onclick=endSpecialist;
  paint();
}

function orb(m){
  const rings = (m==="listening"||m==="speaking") ? '<span class="ring"></span><span class="ring b"></span><span class="ring c"></span>' : "";
  const inner = m==="thinking" ? "⏳" : m==="speaking" ? "🔊" : "🎙";
  return '<div class="orb '+m+'">'+rings+'<div class="core">'+inner+'</div></div>';
}
function statusText(){ const t=T[lang]; return uiMode==="listening"?t.listening:uiMode==="thinking"?t.thinking:uiMode==="speaking"?t.speaking:t.tap; }

function paint(){
  const sc=document.getElementById("scroll"); if(!sc) return;
  const t=T[lang];
  let html="";
  if(mode==="agent"){
    html+='<div class="banner live"><span>🟢 '+t.liveWith+'</span><button id="endBtn">'+t.end+'</button></div>';
  }
  messages.forEach(m=>{
    if(m.role==="user") html+='<div class="msg u"><div class="b"><span>'+esc(m.text)+'</span></div></div>';
    else if(m.role==="agent") html+='<div class="msg g"><div class="b"><span class="dot">🎧</span><span><span class="who">'+SPECIALIST+' · '+t.specialist+'</span>'+esc(m.text)+'</span></div></div>';
    else html+='<div class="msg a"><div class="b"><span class="dot">🔊</span><span>'+esc(m.text)+'</span></div></div>';
  });
  sc.innerHTML=html;
  const endB=document.getElementById("endBtn"); if(endB) endB.onclick=endSpecialist;
  sc.scrollTop=sc.scrollHeight;
}
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function escBlock(){
  const t=T[lang];
  return '<div class="esc" dir="'+(RTL[lang]?"rtl":"ltr")+'">'+
    '<div class="top"><span>🎧 '+t.callTitle+'</span><span class="tag">'+t.finalStep+'</span></div>'+
    '<div class="pad">'+
      '<button class="full" id="specBtn">🎧 '+t.talkSpecialist+'</button>'+
      '<a class="num" href="'+tel+'"><b dir="ltr">'+HELPLINE+'</b><span>'+t.callHours+'</span></a>'+
      '<div class="two"><a class="call" href="'+tel+'">📞 '+t.callNow+'</a>'+
      '<button class="keep" id="keepBtn">'+t.keep+'</button></div>'+
    '</div></div>';
}

function setMode(m){ uiMode=m; const s=document.getElementById("status"); if(s){ s.className="status "+m; s.textContent=statusText(); }
  const mic=document.getElementById("micBtn"); if(mic){ mic.className="mic "+(m==="listening"?"on":m==="speaking"?"sp":""); }
  const ow=document.getElementById("orbTap"); if(ow){ ow.innerHTML=orb(m); } }

async function start(){
  started=true;
  try{ if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){ const s=await navigator.mediaDevices.getUserMedia({audio:true}); s.getTracks().forEach(x=>x.stop()); } }
  catch(e){ /* mic denied; text fallback still works */ }
  messages.push({role:"assistant",text:T[lang].greeting});
  render();
  speak(T[lang].greeting);
}

function onMic(){
  if(uiMode==="listening"){ stopListen(); setMode("idle"); return; }
  if(uiMode==="speaking"){ stopAudio(); setMode("idle"); listen(); return; }
  listen();
}

let rec=null;
function listen(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ document.getElementById("typeRow").classList.remove("hidden"); return; }
  stopAudio();
  rec=new SR(); rec.lang=CODE[lang]; rec.interimResults=true; rec.continuous=false;
  let final="";
  rec.onresult=e=>{ for(let i=e.resultIndex;i<e.results.length;i++){ if(e.results[i].isFinal) final+=e.results[i][0].transcript; } };
  rec.onerror=ev=>{ setMode("idle"); if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){ banner(T[lang].micBlocked); document.getElementById("typeRow").classList.remove("hidden"); } };
  rec.onend=()=>{ const said=final.trim(); if(said) ask(said); else if(uiMode==="listening") setMode("idle"); };
  setMode("listening");
  try{ rec.start(); }catch(e){ setMode("idle"); }
}
function stopListen(){ try{ rec&&rec.stop(); }catch(e){} }

function banner(text){
  const sc=document.getElementById("scroll"); if(!sc) return;
  const d=document.createElement("div"); d.className="banner warn"; d.textContent=text; sc.prepend(d);
}

function sendTyped(){
  const inp=document.getElementById("typeInput"); const v=inp.value.trim(); if(!v) return; inp.value=""; ask(v);
}

async function ask(text){
  messages.push({role:"user",text}); escalated=null; render(); setMode("thinking");
  const api = messages.map(m=>({role:(m.role==="user")?"user":"assistant",content:m.text}));
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages:api,lang,mode})});
    const data=await r.json();
    const reply=(data.reply||"").trim()||T[lang].error;
    messages.push({role:mode==="agent"?"agent":"assistant",text:reply});
    render();
    await speak(reply);
    if(mode==="ai" && data.escalate && data.reason && data.reason!=="none"){ escalated=data.reason; render(); }
  }catch(e){
    messages.push({role:"assistant",text:T[lang].error}); render(); speak(T[lang].error);
  }
}

function startSpecialist(){
  escalated=null; mode="agent";
  const g=T[lang].agentGreeting;
  messages.push({role:"agent",text:g}); render(); speak(g);
}
function endSpecialist(){
  mode="ai"; messages.push({role:"assistant",text:T[lang].back}); render();
}

function stopAudio(){ if(currentAudio){ try{ currentAudio.pause(); }catch(e){} currentAudio=null; } if(window.speechSynthesis) try{ speechSynthesis.cancel(); }catch(e){} }

async function speak(text){
  stopAudio(); setMode("speaking");
  try{
    const r=await fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,lang})});
    if(!r.ok) throw new Error("tts");
    const blob=await r.blob();
    const audio=new Audio(URL.createObjectURL(blob)); currentAudio=audio;
    await new Promise((res)=>{ audio.onended=res; audio.onerror=res; audio.play().catch(res); });
  }catch(e){
    // graceful fallback to the browser voice if ElevenLabs is unreachable
    try{ const u=new SpeechSynthesisUtterance(text); u.lang=CODE[lang]; await new Promise(res=>{ u.onend=res; u.onerror=res; speechSynthesis.speak(u); }); }catch(_){}
  }
  currentAudio=null; if(uiMode==="speaking") setMode("idle");
}

renderLangs(); render();
</script>
