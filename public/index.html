<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LocomotePro Assistant</title>
<style>
  :root{--navy0:#031024;--navy1:#05091A;--navy2:#0B1330;--panel:#111B3D;
    --line:rgba(143,160,188,0.16);--cyan:#2DD4E0;--green:#2BD17E;--amber:#F6A93B;--text:#EEF3FB;--muted:#8FA0BC;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--navy1);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;justify-content:center;padding:24px 12px;min-height:100vh}
  .card{width:100%;max-width:440px;height:690px;background:var(--navy2);border:1px solid var(--line);
    border-radius:20px;box-shadow:0 20px 55px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden}
  .head{background:var(--navy0);padding:15px 18px 13px}
  .row{display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--cyan),var(--green));
    display:flex;align-items:center;justify-content:center;font-size:20px}
  .back{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.04);
    color:var(--muted);cursor:pointer;font-size:16px}
  .title{font-weight:600;font-size:15px;color:var(--text)}
  .sub{font-size:11px;color:var(--muted)}
  .langs{display:flex;gap:4px;align-items:center}
  .langs button{font-size:11.5px;padding:3px 8px;border-radius:7px;border:none;cursor:pointer;background:rgba(255,255,255,.06);color:var(--muted)}
  .langs button.on{background:var(--cyan);color:var(--navy0);font-weight:600}
  .body{flex:1;display:flex;flex-direction:column;min-height:0}
  .center{flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px 22px}
  .h1{font-size:20px;font-weight:600;color:var(--text);margin-bottom:6px}
  .p{font-size:13.5px;color:var(--muted);line-height:1.5;margin-bottom:22px}
  .opt{display:flex;gap:14px;align-items:center;text-align:left;cursor:pointer;padding:16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:12px;width:100%}
  .opt .ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
  .opt .t{font-size:15px;font-weight:600;color:var(--text)}
  .opt .d{font-size:12.5px;color:var(--muted);line-height:1.4}
  .note{display:flex;gap:7px;align-items:center;margin-top:8px;font-size:11.5px;color:var(--muted)}
  .scroll{flex:1;overflow-y:auto;padding:16px 14px 8px}
  .msg{display:flex;margin-bottom:10px}
  .msg .b{max-width:86%;padding:9px 13px;border-radius:13px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;display:flex;gap:7px;align-items:flex-start}
  .msg.u{justify-content:flex-end}
  .msg.u .b{background:var(--cyan);color:var(--navy0);border-top-right-radius:3px}
  .msg.a .b{background:var(--panel);color:var(--text);border:1px solid var(--line);border-top-left-radius:3px}
  .msg.g .b{background:var(--panel);color:var(--text);border:1px solid rgba(43,209,126,.35);border-top-left-radius:3px}
  .who{display:block;font-size:10.5px;color:var(--green);font-weight:600;margin-bottom:2px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
  .chip{font-size:12.5px;color:var(--cyan);background:rgba(45,212,224,.08);border:1px solid var(--line);border-radius:20px;padding:6px 11px;cursor:pointer}
  .banner{border-radius:10px;padding:8px 11px;margin-bottom:12px;font-size:12px}
  .warn{background:rgba(246,169,59,.10);border:1px solid rgba(246,169,59,.28);color:var(--amber)}
  .live{background:rgba(43,209,126,.10);border:1px solid rgba(43,209,126,.28);color:var(--green);display:flex;align-items:center;justify-content:space-between}
  .live button{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:11.5px;cursor:pointer}
  .esc{margin:0 0 12px;border:1px solid rgba(43,209,126,.35);border-radius:14px;overflow:hidden;background:var(--panel)}
  .esc .top{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;background:linear-gradient(90deg,var(--navy0),#0C2A1B)}
  .esc .tag{font-size:9.5px;color:var(--green);text-transform:uppercase;letter-spacing:.5px;border:1px solid rgba(43,209,126,.4);border-radius:6px;padding:2px 6px}
  .esc .pad{padding:11px 13px}
  .esc .full{width:100%;background:var(--cyan);color:var(--navy0);border:none;border-radius:10px;padding:10px;font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:10px}
  .esc .num{display:flex;align-items:center;justify-content:space-between;background:var(--navy2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:9px;text-decoration:none}
  .esc .num b{font-size:15.5px;color:var(--text)} .esc .num span{font-size:10.5px;color:var(--muted)}
  .esc .two{display:flex;gap:8px}
  .esc .call{flex:1;text-align:center;background:var(--green);color:var(--navy0);border-radius:10px;padding:9px;font-size:13px;font-weight:600;text-decoration:none}
  .esc .keep{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:12.5px;cursor:pointer}
  .foot{border-top:1px solid var(--line);background:var(--navy0);padding:10px 12px}
  .inp{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:5px 6px 5px 12px}
  .inp input{flex:1;border:none;outline:none;background:transparent;font-size:14px;color:var(--text)}
  .send{width:36px;height:36px;border-radius:10px;border:none;background:var(--cyan);color:var(--navy0);cursor:pointer;font-size:16px;flex:none}
  .send:disabled{background:rgba(143,160,188,.25);cursor:default}
  .signin{font-size:12px;border:none;border-radius:9px;padding:6px 11px;cursor:pointer;font-weight:600;background:var(--cyan);color:var(--navy0)}
  .signout{font-size:12px;border:1px solid var(--line);border-radius:9px;padding:6px 10px;cursor:pointer;background:rgba(255,255,255,.06);color:var(--muted)}
  /* voice */
  .vcenter{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 26px}
  .btn{border:none;border-radius:14px;padding:13px 30px;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--cyan),var(--green));color:var(--navy0)}
  .status{font-size:13px;margin:12px 0;font-weight:500;color:var(--muted)}
  .status.listening{color:var(--cyan)} .status.speaking{color:var(--green)}
  .controls{display:flex;align-items:center;gap:14px;justify-content:center}
  .mini{width:42px;height:42px;border-radius:21px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px;text-decoration:none}
  .mic{width:58px;height:58px;border-radius:29px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--cyan),var(--green));display:flex;align-items:center;justify-content:center;font-size:24px}
  .mic.on{background:var(--cyan);box-shadow:0 0 0 6px rgba(45,212,224,.15);animation:bob 1.1s ease-in-out infinite}
  .mic.sp{background:var(--green)}
  .orb{position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center;margin:0 auto}
  .orb .core{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--cyan),var(--navy2));box-shadow:0 0 26px rgba(45,212,224,.4),inset 0 0 18px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:26px}
  .orb.speaking .core{background:radial-gradient(circle at 35% 30%,var(--green),var(--navy2));box-shadow:0 0 26px rgba(43,209,126,.45);animation:bob .9s ease-in-out infinite}
  .orb.thinking .core{animation:spin 1.6s linear infinite}
  .orb .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--cyan);animation:ring 1.8s ease-out infinite}
  .orb.speaking .ring{border-color:var(--green)}
  .orb .ring.b{animation-delay:.6s}.orb .ring.c{animation-delay:1.2s}
  .type{display:flex;align-items:center;gap:8px;margin-top:14px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 6px 5px 12px}
  .type input{flex:1;border:none;outline:none;background:transparent;font-size:14px;color:var(--text)}
  .type button{width:34px;height:34px;border-radius:9px;border:none;background:var(--cyan);color:var(--navy0);cursor:pointer;font-size:15px}
  .hidden{display:none!important}
  [dir=rtl] .msg.u{justify-content:flex-start}
  [dir=rtl] .msg.a,[dir=rtl] .msg.g{justify-content:flex-end}
  @keyframes ring{0%{transform:scale(.75);opacity:.55}100%{transform:scale(1.7);opacity:0}}
  .fl{font-size:11.5px;color:var(--muted);margin-bottom:6px;display:block}
  .avatar{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--green));display:flex;align-items:center;justify-content:center;font-size:42px;margin:0 auto}
  .avatar.rng{animation:cring 1.5s ease-out infinite}
  @keyframes cring{0%{box-shadow:0 0 0 0 rgba(45,212,224,.45)}100%{box-shadow:0 0 0 28px rgba(45,212,224,0)}}
  .calltxt{text-align:center;color:var(--text);font-size:18px;font-weight:600;margin-top:20px}
  .callsub{text-align:center;color:var(--muted);font-size:13px;margin-top:4px}
  .dots3{display:flex;gap:6px;justify-content:center;margin-top:14px}
  .dots3 span{width:8px;height:8px;border-radius:8px;background:var(--cyan);animation:bl 1.3s infinite}
  .dots3 span:nth-child(2){animation-delay:.2s}.dots3 span:nth-child(3){animation-delay:.4s}
  @keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .keypad{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
  .key{display:flex;align-items:center;gap:10px;padding:12px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);cursor:pointer;color:var(--text);font-size:13.5px}
  .key .num{width:28px;height:28px;border-radius:50%;background:rgba(45,212,224,.15);border:1px solid rgba(45,212,224,.4);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--cyan);font-size:14px;flex:none}
  .key.on{border-color:var(--green)}
  .talk{width:100%;background:linear-gradient(135deg,var(--cyan),var(--green));color:var(--navy0);border:none;border-radius:12px;padding:12px;font-size:14.5px;font-weight:600;cursor:pointer}
  .hangpill{background:#e5484d;color:#fff;border:none;border-radius:12px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer}
  .callscreen{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-height:0}
  .calltop{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 24px;text-align:center;overflow-y:auto}
  .calltimer{color:var(--muted);font-size:13px;letter-spacing:.5px;margin-bottom:22px}
  .cav{position:relative;width:130px;height:130px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .cavcore{width:104px;height:104px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--green));display:flex;align-items:center;justify-content:center;font-size:46px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .cav .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--cyan);opacity:0}
  .cav.listening .ring{animation:ring 1.8s ease-out infinite;border-color:var(--cyan)}
  .cav.speaking .ring{animation:ring 1.6s ease-out infinite;border-color:var(--green)}
  .cav.thinking .cavcore{animation:spin 1.6s linear infinite}
  .cav .ring.b{animation-delay:.6s}.cav .ring.c{animation-delay:1.2s}
  .cav.speaking .cavcore{animation:bob .9s ease-in-out infinite}
  .cname{color:var(--text);font-size:20px;font-weight:600;margin-top:24px}
  .cstatus{font-size:13.5px;color:var(--muted);margin-top:6px}
  .cstatus.listening{color:var(--cyan)}.cstatus.speaking{color:var(--green)}
  .caption{color:var(--text);font-size:14px;line-height:1.5;margin-top:16px;min-height:44px;max-width:320px;opacity:.92}
  .callbar{display:flex;align-items:center;justify-content:space-around;padding:12px 22px 18px}
  .cbtn{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
  .cico{width:56px;height:56px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--text)}
  .cico.on{background:var(--cyan);color:var(--navy0);border-color:var(--cyan)}
  .clbl{font-size:11px;color:var(--muted)}
  .cend{background:#e5484d;border:none;cursor:pointer;width:64px;height:64px;border-radius:50%;font-size:26px;color:#fff;display:flex;align-items:center;justify-content:center}
  .cendwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
  @keyframes bob{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

let lang="en", screen="intake";
let userName="", userContact="", userRegion="";
// chat state
let cMsg=[], cMode="ai", authed=false, cEsc=null;
// voice state
let vPhase="dialing", vRegion="", vMsg=[], vMode="ai", vUI="idle", vEsc=null, vAudio=null, callStart=0, callTimer=null, vInterim="";

const bodyEl=document.getElementById("body");
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const dir=()=>RTL[lang]?"rtl":"ltr";
const pgreet=g=>userName?(T[lang].hi.replace("{n}",userName)+" "+g):g;

function renderHead(){
  const b=document.getElementById("brand");
  const backBtn = screen!=="intake" ? '<button class="back" id="backBtn">‹</button>' : '';
  b.innerHTML = backBtn + '<div class="logo">🚚</div><div><div class="title">LocomotePro</div><div class="sub">Support · Wahyd LOS</div></div>';
  if(screen!=="intake"){ const bb=document.getElementById("backBtn"); bb.onclick=()=>{ stopAudio(); screen=(screen==="launcher"?"intake":"launcher"); render(); }; }
  const el=document.getElementById("langs");
  el.innerHTML="";
  if(screen==="chat"){
    const s=document.createElement("button");
    s.className = authed?"signout":"signin"; s.textContent = authed?T[lang].signOut:T[lang].signIn;
    s.onclick=()=>{ authed=!authed; cMsg=[{role:"assistant",text:authed?T[lang].greetingAuth:pgreet(T[lang].greeting)}]; cMode="ai"; cEsc=null; render(); };
    el.appendChild(s);
  }
  LANGS.forEach(l=>{ const btn=document.createElement("button"); btn.textContent=l.label; if(l.id===lang)btn.className="on";
    btn.onclick=()=>{ lang=l.id; render(); }; el.appendChild(btn); });
}

function render(){ renderHead(); if(screen==="intake")renderIntake(); else if(screen==="launcher")renderLauncher(); else if(screen==="chat")renderChat(); else renderVoice(); }

function renderIntake(){
  const t=T[lang];
  bodyEl.innerHTML='<div class="center" dir="'+dir()+'" style="overflow-y:auto">'+
    '<div class="h1">'+t.intakeTitle+'</div><div class="p">'+t.intakeSub+'</div>'+
    '<label class="fl">'+t.nameLabel+' <span style="color:var(--cyan)">*</span></label>'+
    '<div class="inp" style="margin-bottom:12px"><input id="inName" placeholder="'+t.namePh+'" value="'+esc(userName)+'"/></div>'+
    '<label class="fl">'+t.contactLabel+'</label>'+
    '<div class="inp" style="margin-bottom:12px"><input id="inContact" placeholder="'+t.contactPh+'" value="'+esc(userContact)+'"/></div>'+
    '<label class="fl">'+t.locLabel+' <span style="color:var(--cyan)">*</span></label>'+
    '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:18px">'+
      REGIONS.map(r=>'<button class="opt" data-r="'+r.id+'" style="margin-bottom:0;padding:10px 13px"><div class="ic" style="width:32px;height:32px;font-size:15px;background:rgba(45,212,224,.10);border:1px solid var(--line)">📍</div><div style="flex:1"><div class="t" style="font-size:13.5px">'+r.name+'</div></div>'+(userRegion===r.id?'<div style="color:var(--green)">●</div>':'<div style="color:var(--muted)">›</div>')+'</button>').join("")+
    '</div>'+
    '<button class="btn" id="inGo" style="width:100%">'+t.cont+'</button></div>';
  const nameEl=document.getElementById("inName"), contactEl=document.getElementById("inContact"), goEl=document.getElementById("inGo");
  const upd=()=>{ const ok=nameEl.value.trim()&&userRegion; goEl.disabled=!ok; goEl.style.opacity=ok?"1":".5"; };
  nameEl.addEventListener("input",e=>{ userName=e.target.value; upd(); });
  contactEl.addEventListener("input",e=>userContact=e.target.value);
  bodyEl.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ userName=nameEl.value; userContact=contactEl.value; userRegion=b.dataset.r; renderIntake(); });
  upd();
  const go=()=>{ if(!(nameEl.value.trim()&&userRegion))return; userName=nameEl.value.trim(); userContact=(contactEl.value||"").trim(); screen="launcher"; render(); };
  goEl.onclick=go;
  nameEl.addEventListener("keydown",e=>{ if(e.key==="Enter")go(); });
}

function renderLauncher(){
  const t=T[lang];
  bodyEl.innerHTML='<div class="center" dir="'+dir()+'">'+
    '<div class="h1">'+t.how+'</div><div class="p">'+t.choose+'</div>'+
    '<button class="opt" id="optChat"><div class="ic" style="background:rgba(45,212,224,.12);border:1px solid rgba(45,212,224,.35)">💬</div><div style="flex:1"><div class="t">'+t.chat+'</div><div class="d">'+t.chatD+'</div></div><div style="color:var(--muted)">›</div></button>'+
    '<button class="opt" id="optVoice"><div class="ic" style="background:rgba(43,209,126,.12);border:1px solid rgba(43,209,126,.35)">📞</div><div style="flex:1"><div class="t">'+t.callOption+'</div><div class="d">'+t.callOptionD+'</div></div><div style="color:var(--muted)">›</div></button>'+
    '<div class="note">📞 '+t.ladder+'</div></div>';
  document.getElementById("optChat").onclick=()=>{ screen="chat"; if(!cMsg.length)cMsg=[{role:"assistant",text:authed?T[lang].greetingAuth:pgreet(T[lang].greeting)}]; render(); };
  document.getElementById("optVoice").onclick=()=>{ screen="voice"; vRegion=userRegion; lang=(REGIONS.find(r=>r.id===userRegion)||{}).lang||lang; vPhase="dialing"; vMsg=[]; vMode="ai"; vEsc=null; vUI="idle"; callStart=0; vInterim=""; render(); setTimeout(()=>{ if(vPhase==="dialing"){ vPhase="menu"; render(); playMenu(); } },2600); };
}

/* ---------- CHAT ---------- */
function renderChat(){
  const t=T[lang];
  bodyEl.innerHTML='<div class="scroll" id="scroll" dir="'+dir()+'"></div>'+
    '<div class="foot"><div class="inp" dir="'+dir()+'"><input id="cin" placeholder="'+t.placeholder+'"/><button class="send" id="csend">➤</button></div></div>';
  document.getElementById("csend").onclick=cSend;
  const inp=document.getElementById("cin"); inp.addEventListener("keydown",e=>{ if(e.key==="Enter")cSend(); });
  paintChat();
}
function paintChat(){
  const sc=document.getElementById("scroll"); if(!sc)return; const t=T[lang];
  let h="";
  if(cMode==="agent") h+='<div class="banner live"><span>🟢 '+t.liveWith+'</span><button id="cEnd">'+t.end+'</button></div>';
  cMsg.forEach(m=>{
    if(m.role==="user") h+='<div class="msg u"><div class="b">'+esc(m.text)+'</div></div>';
    else if(m.role==="agent") h+='<div class="msg g"><div class="b">🎧 <span><span class="who">'+SPECIALIST+' · '+t.specialist+'</span>'+esc(m.text)+'</span></div></div>';
    else if(m.role==="down") h+='<div class="banner warn">'+esc(m.text)+'</div>';
    else h+='<div class="msg a"><div class="b">'+esc(m.text)+'</div></div>';
  });
  if(cEsc) h+=escBlock("c");
  if(cMode==="ai" && !cMsg.some(m=>m.role==="user")){
    const chips=authed?t.suggestAuth:t.suggest;
    h+='<div class="chips">'+chips.map(s=>'<button class="chip" data-s="'+esc(s)+'">'+esc(s)+' ›</button>').join("")+'</div>';
  }
  sc.innerHTML=h;
  const e=document.getElementById("cEnd"); if(e)e.onclick=()=>{ cMode="ai"; cMsg.push({role:"assistant",text:t.back}); render(); };
  wireEsc("c");
  sc.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ cAsk(b.dataset.s); });
  sc.scrollTop=sc.scrollHeight;
}
function cSend(){ const i=document.getElementById("cin"); const v=(i.value||"").trim(); if(!v)return; i.value=""; cAsk(v); }
async function cAsk(text){
  cMsg.push({role:"user",text}); cEsc=null; paintChat();
  cMsg.push({role:"assistant",text:"…"}); const idx=cMsg.length-1; paintChat();
  const api=cMsg.filter(m=>m.role==="user"||m.role==="assistant"||m.role==="agent").filter(m=>m.text!=="…").map(m=>({role:m.role==="user"?"user":"assistant",content:m.text}));
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:api,lang,mode:cMode,authed,name:userName})});
    const d=await r.json();
    if(d.error){ cMsg.splice(idx,1); cMsg.push({role:"down",text:T[lang].down}); paintChat(); return; }
    const reply=(d.reply||"").trim()||T[lang].error;
    cMsg[idx]={role:cMode==="agent"?"agent":"assistant",text:reply};
    if(cMode==="ai" && d.escalate && d.reason && d.reason!=="none") cEsc=d.reason;
    paintChat();
  }catch(e){ cMsg.splice(idx,1); cMsg.push({role:"down",text:T[lang].down}); paintChat(); }
}

/* ---------- shared escalation card ---------- */
function escBlock(){
  const t=T[lang];
  return '<div class="esc" dir="'+dir()+'"><div class="top"><span>🎧 '+t.callTitle+'</span><span class="tag">'+t.finalStep+'</span></div>'+
    '<div class="pad"><button class="full" id="specBtn">🎧 '+t.talkSpec+'</button>'+
    '<a class="num" href="'+tel+'"><b dir="ltr">'+HELPLINE+'</b><span>'+t.callHours+'</span></a>'+
    '<div class="two"><a class="call" href="'+tel+'">📞 '+t.callNow+'</a><button class="keep" id="keepBtn">'+t.keep+'</button></div></div></div>';
}
function wireEsc(which){
  const s=document.getElementById("specBtn"), k=document.getElementById("keepBtn");
  if(s)s.onclick=()=>{ if(which==="c"){ cEsc=null; cMode="agent"; cMsg.push({role:"agent",text:T[lang].agentGreeting}); paintChat(); }
    else { vEsc=null; vMode="agent"; const g=T[lang].agentGreeting; vMsg.push({role:"agent",text:g}); render(); (async()=>{ await speak(g); autoListen(); })(); } };
  if(k)k.onclick=()=>{ if(which==="c"){ cEsc=null; paintChat(); } else { vEsc=null; render(); autoListen(); } };
}

/* ---------- VOICE ---------- */
function renderVoice(){
  const t=T[lang];
  if(vPhase==="dialing"){
    bodyEl.innerHTML='<div class="center" dir="'+dir()+'" style="align-items:center;text-align:center">'+
      '<div class="avatar rng">🎧</div>'+
      '<div class="calltxt">'+t.callName+'</div><div class="callsub">'+t.connecting+'</div>'+
      '<div class="dots3"><span></span><span></span><span></span></div>'+
      '<div style="margin-top:30px"><button class="hangpill" id="vhang">'+t.hangUp+'</button></div></div>';
    document.getElementById("vhang").onclick=endCall;
    return;
  }
  if(vPhase==="menu"){
    bodyEl.innerHTML='<div class="center" dir="'+dir()+'" style="align-items:stretch;overflow-y:auto">'+
      '<div style="text-align:center"><div class="avatar">🎧</div><div class="calltxt">'+t.callName+'</div><div class="callsub">🟢 '+t.connected+'</div></div>'+
      '<div class="p" style="text-align:center;margin-top:14px">'+t.menuHint+'</div>'+
      '<div class="keypad">'+LANGS.map((l,i)=>'<button class="key '+(l.id===lang?"on":"")+'" data-l="'+l.id+'"><span class="num">'+(i+1)+'</span><span>'+LANG_NATIVE[l.id]+'</span></button>').join("")+'</div>'+
      '<button class="talk" id="vtalk">'+t.startTalking+'</button>'+
      '<div style="text-align:center;margin-top:14px"><button class="hangpill" id="vhang">'+t.hangUp+'</button></div></div>';
    bodyEl.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ lang=b.dataset.l; vPhase="call"; render(); vBegin(); });
    document.getElementById("vtalk").onclick=()=>{ vPhase="call"; render(); vBegin(); };
    document.getElementById("vhang").onclick=endCall;
    return;
  }
  bodyEl.innerHTML='<div class="callscreen" dir="'+dir()+'">'+
    '<div class="calltop">'+
      '<div class="calltimer" id="ctimer">00:00</div>'+
      '<div class="cav '+vUI+'" id="cav"><span class="ring"></span><span class="ring b"></span><span class="ring c"></span><div class="cavcore">🎧</div></div>'+
      '<div class="cname">'+(vMode==="agent"?SPECIALIST:t.callName)+'</div>'+
      '<div class="cstatus '+vUI+'" id="cstatus">'+vStatus()+'</div>'+
      '<div class="caption" id="ccap"></div>'+
    '</div>'+
    (vEsc?'<div style="padding:0 12px">'+escBlock()+'</div>':'')+
    '<div class="type hidden" id="vtype" dir="'+dir()+'" style="margin:0 16px 10px"><input id="vin" placeholder="'+t.typePh+'"/><button id="vsend">➤</button></div>'+
    '<div class="callbar">'+
      '<button class="cbtn" id="cmic"><div class="cico" id="cmicico">🎙</div><div class="clbl">'+t.talkBtn+'</div></button>'+
      '<div class="cendwrap"><button class="cend" id="vhang">📞</button><div class="clbl">'+t.hangUp+'</div></div>'+
      '<button class="cbtn" id="ckey"><div class="cico">⌨️</div><div class="clbl">'+t.keypadLbl+'</div></button>'+
    '</div></div>';
  document.getElementById("cav").onclick=vMicTap;
  document.getElementById("cmic").onclick=vMicTap;
  document.getElementById("ckey").onclick=()=>{ stopAudio(); vStop(); vPhase="menu"; render(); };
  document.getElementById("vhang").onclick=endCall;
  document.getElementById("vsend").onclick=vTyped;
  document.getElementById("vin").addEventListener("keydown",e=>{ if(e.key==="Enter")vTyped(); });
  wireEsc("v");
  startTimer();
  paintVoice();
}
function playMenu(){ speak(T[lang].menuPrompt); }
function startTimer(){ if(!callStart)callStart=Date.now(); if(callTimer)clearInterval(callTimer); callTimer=setInterval(()=>{ const el=document.getElementById("ctimer"); if(!el){ clearInterval(callTimer); callTimer=null; return; } const s=Math.floor((Date.now()-callStart)/1000); el.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); },1000); }
function autoListen(){ if(vPhase==="call") setTimeout(()=>{ if(vPhase==="call"&&vUI==="idle"&&!vEsc)vListen(); },350); }
function endCall(){ stopAudio(); vStop(); if(callTimer){ clearInterval(callTimer); callTimer=null; } callStart=0; vMsg=[]; vMode="ai"; vEsc=null; vUI="idle"; vInterim=""; screen="launcher"; vPhase="dialing"; render(); }
function paintCap(){ const cap=document.getElementById("ccap"); if(!cap)return; let line=""; if(vUI==="listening"&&vInterim)line=vInterim; else { for(let i=vMsg.length-1;i>=0;i--){ const r=vMsg[i].role; if(r==="assistant"||r==="agent"||r==="down"){ line=vMsg[i].text; break; } } } cap.textContent=line; }
function paintVoice(){ paintCap(); }
function orb(m){ const rings=(m==="listening"||m==="speaking")?'<span class="ring"></span><span class="ring b"></span><span class="ring c"></span>':""; const i=m==="thinking"?"⏳":m==="speaking"?"🔊":"🎙"; return '<div class="orb '+m+'">'+rings+'<div class="core">'+i+'</div></div>'; }
function vStatus(){ const t=T[lang]; return vUI==="listening"?t.listening:vUI==="thinking"?t.thinking:vUI==="speaking"?t.speaking:t.tap; }
function setVUI(m){ vUI=m;
  const cs=document.getElementById("cstatus"); if(cs){ cs.className="cstatus "+m; cs.textContent=vStatus(); }
  const cav=document.getElementById("cav"); if(cav) cav.className="cav "+m;
  const mi=document.getElementById("cmicico"); if(mi){ mi.parentElement.className="cico "+(m==="listening"?"on":""); }
  paintCap();
}
async function vBegin(){ try{ if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){ const s=await navigator.mediaDevices.getUserMedia({audio:true}); s.getTracks().forEach(x=>x.stop()); } }catch(e){} const g=pgreet(T[lang].voiceGreeting); vMsg.push({role:"assistant",text:g}); paintCap(); await speak(g); autoListen(); }
function vMicTap(){ if(vUI==="listening"){ vStop(); setVUI("idle"); return; } if(vUI==="speaking"){ stopAudio(); setVUI("idle"); vListen(); return; } vListen(); }
let rec=null;
function vListen(){ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){ const tt=document.getElementById("vtype"); if(tt)tt.classList.remove("hidden"); return; } stopAudio(); rec=new SR(); rec.lang=CODE[lang]; rec.interimResults=true; rec.continuous=false; let fin=""; rec.onresult=e=>{ let itr=""; for(let i=e.resultIndex;i<e.results.length;i++){ if(e.results[i].isFinal)fin+=e.results[i][0].transcript; else itr+=e.results[i][0].transcript; } vInterim=itr; paintCap(); }; rec.onerror=ev=>{ setVUI("idle"); if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){ vMsg.push({role:"down",text:T[lang].micBlocked}); paintCap(); const tt=document.getElementById("vtype"); if(tt)tt.classList.remove("hidden"); } }; rec.onend=()=>{ const s=fin.trim(); vInterim=""; if(s)vAsk(s); else if(vUI==="listening")setVUI("idle"); }; setVUI("listening"); try{ rec.start(); }catch(e){ setVUI("idle"); } }
function vStop(){ try{ rec&&rec.stop(); }catch(e){} }
function vTyped(){ const i=document.getElementById("vin"); const v=(i.value||"").trim(); if(!v)return; i.value=""; vAsk(v); }
async function vAsk(text){
  vInterim=""; vMsg.push({role:"user",text}); vEsc=null; setVUI("thinking");
  const api=vMsg.filter(m=>m.role==="user"||m.role==="assistant"||m.role==="agent").map(m=>({role:m.role==="user"?"user":"assistant",content:m.text}));
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:api,lang,mode:vMode,region:vRegion,name:userName})});
    const d=await r.json();
    if(d.error){ vMsg.push({role:"down",text:T[lang].down}); setVUI("idle"); return; }
    const reply=(d.reply||"").trim()||T[lang].error;
    vMsg.push({role:vMode==="agent"?"agent":"assistant",text:reply});
    await speak(reply);
    if(vMode==="ai" && d.escalate && d.reason && d.reason!=="none"){ vEsc=d.reason; render(); }
    else autoListen();
  }catch(e){ vMsg.push({role:"down",text:T[lang].down}); setVUI("idle"); }
}
function stopAudio(){ if(vAudio){ try{ vAudio.pause(); }catch(e){} vAudio=null; } if(window.speechSynthesis)try{ speechSynthesis.cancel(); }catch(e){} }
async function speak(text){
  stopAudio(); setVUI("speaking");
  try{
    const r=await fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,lang})});
    if(!r.ok)throw new Error("tts");
    const a=new Audio(URL.createObjectURL(await r.blob())); vAudio=a;
    await new Promise(res=>{ a.onended=res; a.onerror=res; a.play().catch(res); });
  }catch(e){ try{ const u=new SpeechSynthesisUtterance(text); u.lang=CODE[lang]; await new Promise(res=>{ u.onend=res; u.onerror=res; speechSynthesis.speak(u); }); }catch(_){} }
  vAudio=null; if(vUI==="speaking")setVUI("idle");
}

document.addEventListener("keydown",e=>{ if(screen==="voice"&&vPhase==="menu"){ const n=parseInt(e.key,10); if(n>=1&&n<=4){ lang=LANGS[n-1].id; vPhase="call"; render(); vBegin(); } } });
render();
</script>
